sentence=Ultra-lightweight WS2812B LED library for ESP8266, ESP32, ESP32-C3, and RP2040 with FastLED drop-in API.
paragraph=Super compact (~2.2 KB Flash vs ~110 KB FastLED), zero dynamic allocations, non-blocking hardware RMT driver for ESP32 and ESP32-C3, hardware PIO driver for RP2040 (Raspberry Pi Pico), cycle-accurate bitbang driver for ESP8266. Full FastLED API compatibility for clock and matrix projects.
